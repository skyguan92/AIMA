kind: engine_asset
metadata:
  name: lingbot-world-v2-gb10
  type: lingbot-world-v2
  version: "2026-07-09"
  supported_formats: [safetensors, pytorch]
  supported_model_types: [video_gen]
image:
  # Local ARM64 CUDA image built on GB10 with the upstream LingBot-World-V2 repo baked in.
  name: lingbot-world-v2-gb10
  tag: "latest"
  size_approx_mb: 45000
  platforms: [linux/arm64]
  distribution: local
patterns:
  - "^lingbot-world-v2-gb10$"
  - "lingbot-world-v2"
  - "lingbot"
hardware:
  gpu_arch: Blackwell
  vram_min_mib: 65536
startup:
  command:
    - bash
    - -lc
    - >-
      cd /workspace/lingbot-world-v2 &&
      mkdir -p /outputs &&
      python3 generate.py --task i2v-A14B --infer_mode causal_fast --size 480*832
      --ckpt_dir {{.ModelPath}} --image examples/03/image.jpg --action_path examples/03
      --frame_num 13 --chunk_size 4 --offload_model true
      --local_attn_size 18 --sink_size 6 --save_dir /outputs
      --prompt "A calm forward camera move through a bright indoor robotics lab." &&
      tail -f /dev/null
  env:
    NVIDIA_VISIBLE_DEVICES: all
    CUDA_VISIBLE_DEVICES: "0"
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    HF_HOME: /outputs/.cache/huggingface
    TRANSFORMERS_CACHE: /outputs/.cache/huggingface
  default_args: {}
  health_check:
    timeout_s: 7200
  warmup:
    enabled: false
  log_patterns:
    phases:
      - name: loading_model
        pattern: "Creating WanI2VCausal pipeline|Loading"
        progress: 40
      - name: generating
        pattern: "Generating video"
        progress: 70
      - name: ready
        pattern: "Finished."
        progress: 100
    errors:
      - pattern: "ModuleNotFoundError|ImportError"
        message: "LingBot runtime dependency is missing from the local image."
      - pattern: "CUDA out of memory|CUBLAS_STATUS_ALLOC_FAILED|NVML_SUCCESS"
        message: "GB10 unified-memory pressure during LingBot inference."
api:
  protocol: script
  base_path: ""
amplifier:
  features:
    - gb10_cuda_inference
    - image_to_video_generation
    - scripted_smoke_run
  performance_gain: "Runs the upstream LingBot-World-V2 causal-fast I2V script as a GB10 smoke workload."
  resource_expansion:
    cpu_offload: true
    ssd_offload: false
    npu_offload: false
  performance_multiplier: 1.0
  extends_resource_boundary: true
  effective_vram_multiplier: 1.0
partition_hints:
  min_gpu_memory_mib: 65536
  recommended_gpu_cores_percent: 100
time_constraints:
  cold_start_s: [300, 7200]
  model_switch_s: [60, 900]
power_constraints:
  typical_draw_watts: [40, 140]
runtime:
  default: "container"
  platform_recommendations:
    linux/arm64: "container"
